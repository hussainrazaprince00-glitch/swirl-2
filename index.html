<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>My Ice Cream Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Custom Ice Cream Station</h1>
        <p>Build your own sweet treat by picking your favorite base and toppings!</p>

        <div class="menu-box">
            <h2>Available Toppings</h2>
            <ul>
                <li>🍫 Chocolate Chips</li>
                <li>🍓 Fresh Strawberries</li>
                <li>🥜 Crushed Peanuts</li>
                <li>🍯 Caramel Drizzle</li>
            </ul>
        </div>

        <button onclick="alert('Delicious topping added!')">Add Topping</button>
    </div>

</body>
</html>
